services:
  app:
    build:
      context: .
      target: app
    ports:
      - '127.0.0.1:4310:4310'
    environment:
      OWNER_TOKEN: ${OWNER_TOKEN:?Set a 24+ character OWNER_TOKEN in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4310}
      OWNER_ID: ${OWNER_ID:-opendots-owner}
      INTELLIGENCE_API_KEY: ${INTELLIGENCE_API_KEY:-}
      INTELLIGENCE_API_URL: ${INTELLIGENCE_API_URL:-}
      INTELLIGENCE_WS_URL: ${INTELLIGENCE_WS_URL:-}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_MODEL: ${VOICE_MODEL:-}
      VOICE_NAME: ${VOICE_NAME:-marin}
      SLACK_CHANNEL_NAME: ${SLACK_CHANNEL_NAME:-}
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-}
      SLACK_USER_IDS: ${SLACK_USER_IDS:-}
      SLACK_DOT_ID: ${SLACK_DOT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
      CLINE_API_KEY: ${CLINE_API_KEY:-}
      CLINE_MODEL: ${CLINE_MODEL:-}
      CLINE_BASE_URL: ${CLINE_BASE_URL:-https://api.cline.bot/api/v1}
      # Subscription harnesses are local-dev only: run `claude auth login` /
      # `codex login` on the host and use npm run dev, never Docker.
      CLAUDE_AUTH_MODE: ${CLAUDE_AUTH_MODE:-host}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CODEX_AUTH_MODE: ${CODEX_AUTH_MODE:-host}
      CODEX_MODEL: ${CODEX_MODEL:-}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-parallel}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      BROWSER_URL: http://browser:4311
      BROWSER_SECRET: ${BROWSER_SECRET:-}
    volumes:
      - opendots-data:/data
    networks:
      - browser-link
      - app-egress
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  browser:
    profiles: [browser]
    build:
      context: .
      target: browser
    environment:
      BROWSER_SECRET: ${BROWSER_SECRET:-}
    networks:
      - browser-link
      - browser-egress
    init: true
    restart: unless-stopped
    shm_size: 256mb
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  browser-link:
    internal: true
  app-egress:
  browser-egress:
volumes:
  opendots-data:
